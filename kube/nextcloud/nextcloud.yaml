apiVersion: v1
kind: Namespace
metadata:
  name: nextcloud
---
# ── MariaDB ──────────────────────────────────────────────────────────────────
apiVersion: v1
kind: PersistentVolume
metadata:
  name: nextcloud-db-pv
spec:
  capacity:
    storage: 50Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  hostPath:
    path: /tank/nextcloud/db
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nextcloud-db-pvc
  namespace: nextcloud
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 50Gi
  volumeName: nextcloud-db-pv
  storageClassName: ""
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: nextcloud-db
  namespace: nextcloud
spec:
  serviceName: nextcloud-db
  replicas: 1
  selector:
    matchLabels:
      app: nextcloud-db
  template:
    metadata:
      labels:
        app: nextcloud-db
    spec:
      containers:
        - name: mariadb
          image: mariadb:11
          args:
            - --transaction-isolation=READ-COMMITTED
            - --log-bin=binlog
            - --binlog-format=ROW
          env:
            - name: MYSQL_DATABASE
              value: nextcloud
            - name: MYSQL_USER
              value: nextcloud
            - name: MARIADB_AUTO_UPGRADE
              value: "1"
            - name: MARIADB_DISABLE_UPGRADE_BACKUP
              value: "1"
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: nextcloud-db
                  key: MYSQL_ROOT_PASSWORD
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: nextcloud-db
                  key: MYSQL_PASSWORD
          volumeMounts:
            - name: db
              mountPath: /var/lib/mysql
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
      volumes:
        - name: db
          persistentVolumeClaim:
            claimName: nextcloud-db-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: nextcloud-db
  namespace: nextcloud
spec:
  selector:
    app: nextcloud-db
  ports:
    - port: 3306
      targetPort: 3306
---
# ── Redis ─────────────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nextcloud-redis
  namespace: nextcloud
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nextcloud-redis
  template:
    metadata:
      labels:
        app: nextcloud-redis
    spec:
      containers:
        - name: redis
          image: redis:alpine
          command:
            - redis-server
            - --requirepass
            - $(REDIS_PASSWORD)
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: nextcloud-db
                  key: REDIS_PASSWORD
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: nextcloud-redis
  namespace: nextcloud
spec:
  selector:
    app: nextcloud-redis
  ports:
    - port: 6379
      targetPort: 6379
---
# ── Nextcloud App ─────────────────────────────────────────────────────────────
apiVersion: v1
kind: PersistentVolume
metadata:
  name: nextcloud-data-pv
spec:
  capacity:
    storage: 200Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  hostPath:
    path: /tank/nextcloud/data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nextcloud-data-pvc
  namespace: nextcloud
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 200Gi
  volumeName: nextcloud-data-pv
  storageClassName: ""
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: nextcloud-config-pv
spec:
  capacity:
    storage: 1Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  hostPath:
    path: /tank/nextcloud/config
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nextcloud-config-pvc
  namespace: nextcloud
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  volumeName: nextcloud-config-pv
  storageClassName: ""
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nextcloud
  namespace: nextcloud
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nextcloud
  template:
    metadata:
      labels:
        app: nextcloud
    spec:
      containers:
        - name: nextcloud
          image: nextcloud:stable
          ports:
            - containerPort: 80
          env:
            - name: MYSQL_HOST
              value: nextcloud-db
            - name: MYSQL_DATABASE
              value: nextcloud
            - name: MYSQL_USER
              value: nextcloud
            - name: REDIS_HOST
              value: nextcloud-redis
            - name: NEXTCLOUD_TRUSTED_DOMAINS
              value: "nextcloud.nphls.com localhost"
            - name: TRUSTED_PROXIES
              value: "172.16.0.0/12"
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: nextcloud-db
                  key: MYSQL_PASSWORD
            - name: REDIS_HOST_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: nextcloud-db
                  key: REDIS_PASSWORD
          volumeMounts:
            - name: data
              mountPath: /var/www/html
            - name: config
              mountPath: /var/www/html/config
            - name: documents
              mountPath: /mnt/documents
            - name: users
              mountPath: /mnt/users
            - name: files
              mountPath: /mnt/files
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: nextcloud-data-pvc
        - name: config
          persistentVolumeClaim:
            claimName: nextcloud-config-pvc
        - name: documents
          hostPath:
            path: /tank/documents
            type: Directory
        - name: users
          hostPath:
            path: /tank/users
            type: Directory
        - name: files
          hostPath:
            path: /tank/files
            type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: nextcloud
  namespace: nextcloud
spec:
  type: NodePort
  selector:
    app: nextcloud
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30808
---
# ── Nextcloud Cron ────────────────────────────────────────────────────────────
apiVersion: batch/v1
kind: CronJob
metadata:
  name: nextcloud-cron
  namespace: nextcloud
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: nextcloud-cron
              image: nextcloud:stable
              command: ["/cron.sh"]
              env:
                - name: MYSQL_HOST
                  value: nextcloud-db
                - name: MYSQL_DATABASE
                  value: nextcloud
                - name: MYSQL_USER
                  value: nextcloud
                - name: REDIS_HOST
                  value: nextcloud-redis
                - name: MYSQL_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: nextcloud-db
                      key: MYSQL_PASSWORD
                - name: REDIS_HOST_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: nextcloud-db
                      key: REDIS_PASSWORD
              volumeMounts:
                - name: data
                  mountPath: /var/www/html
                - name: config
                  mountPath: /var/www/html/config
                - name: documents
                  mountPath: /mnt/documents
                - name: users
                  mountPath: /mnt/users
                - name: files
                  mountPath: /mnt/files
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: nextcloud-data-pvc
            - name: config
              persistentVolumeClaim:
                claimName: nextcloud-config-pvc
            - name: documents
              hostPath:
                path: /tank/documents
                type: Directory
            - name: users
              hostPath:
                path: /tank/users
                type: Directory
            - name: files
              hostPath:
                path: /tank/files
                type: Directory
---
# ── Collabora ─────────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nextcloud-collabora
  namespace: nextcloud
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nextcloud-collabora
  template:
    metadata:
      labels:
        app: nextcloud-collabora
    spec:
      containers:
        - name: collabora
          image: collabora/code:latest
          ports:
            - containerPort: 9980
          env:
            - name: domain
              value: "nextcloud\\.nphls\\.com"
            - name: username
              value: admin
            - name: extra_params
              value: "--o:ssl.enable=false --o:ssl.termination=true"
            - name: password
              valueFrom:
                secretKeyRef:
                  name: nextcloud-db
                  key: COLLABORA_PASSWORD
          securityContext:
            capabilities:
              add: ["MKNOD"]
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: nextcloud-collabora
  namespace: nextcloud
spec:
  type: NodePort
  selector:
    app: nextcloud-collabora
  ports:
    - port: 9980
      targetPort: 9980
      nodePort: 30980
