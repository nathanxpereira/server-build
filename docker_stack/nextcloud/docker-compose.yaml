services:
  nextcloud-db:
    image: mariadb:11
    command: --transaction-isolation=READ-COMMITTED --log-bin=binlog --binlog-format=ROW
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_USER=nextcloud
      - MYSQL_DATABASE=nextcloud
      - MARIADB_AUTO_UPGRADE=1
      - MARIADB_DISABLE_UPGRADE_BACKUP=1
    volumes:
      - ${NEXTCLOUD_DB_DIR}:/var/lib/mysql
    networks:
      - nextcloud-net
    restart: unless-stopped

  nextcloud-redis:
    image: redis:alpine
    command: redis-server --requirepass ${REDIS_PASSWORD}
    networks:
      - nextcloud-net
    restart: unless-stopped

  nextcloud-app:
    image: nextcloud:stable
    ports:
      - '80:80'
    environment:
      - MYSQL_HOST=nextcloud-db
      - MYSQL_DATABASE=nextcloud
      - MYSQL_USER=nextcloud
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - REDIS_HOST=nextcloud-redis
      - REDIS_HOST_PASSWORD=${REDIS_PASSWORD}
      - NEXTCLOUD_TRUSTED_DOMAINS=nextcloud.nphls.com localhost
      - TRUSTED_PROXIES=172.16.0.0/12
    volumes:
      - ${NEXTCLOUD_DATA_DIR}:/var/www/html/data
      - ${NEXTCLOUD_CONFIG_DIR}:/var/www/html/config
      - ${NEXTCLOUD_DOCUMENTS_DIR}:${NEXTCLOUD_DOCUMENTS_DIR}
      - ${NEXTCLOUD_USERS_DIR}:${NEXTCLOUD_USERS_DIR}
      - ${NEXTCLOUD_FILES_DIR}:${NEXTCLOUD_FILES_DIR}
    networks:
      - nextcloud-net
    depends_on:
      - nextcloud-db
      - nextcloud-redis
    restart: unless-stopped

  nextcloud-cron:
    image: nextcloud:stable
    entrypoint: /cron.sh
    environment:
      - MYSQL_HOST=nextcloud-db
      - MYSQL_DATABASE=nextcloud
      - MYSQL_USER=nextcloud
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - REDIS_HOST=nextcloud-redis
      - REDIS_HOST_PASSWORD=${REDIS_PASSWORD}
    volumes:
      - ${NEXTCLOUD_DATA_DIR}:/var/www/html/data
      - ${NEXTCLOUD_CONFIG_DIR}:/var/www/html/config
      - ${NEXTCLOUD_DOCUMENTS_DIR}:${NEXTCLOUD_DOCUMENTS_DIR}
      - ${NEXTCLOUD_USERS_DIR}:${NEXTCLOUD_USERS_DIR}
      - ${NEXTCLOUD_FILES_DIR}:${NEXTCLOUD_FILES_DIR}
    networks:
      - nextcloud-net
    depends_on:
      - nextcloud-app
    restart: unless-stopped

  nextcloud-collabora:
    image: collabora/code:latest
    ports:
      - '9980:9980'
    environment:
      - domain=nextcloud\\.nphls\\.com
      - username=admin
      - password=${COLLABORA_PASSWORD}
      - extra_params=--o:ssl.enable=false --o:ssl.termination=true
    cap_add:
      - MKNOD
    networks:
      - nextcloud-net
    restart: unless-stopped

networks:
  nextcloud-net:
